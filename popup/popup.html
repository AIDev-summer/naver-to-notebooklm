<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>한글 소스 to NotebookLM</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <h1>NotebookLM에 추가</h1>
    <a id="open-nlm" class="icon-link" href="https://notebooklm.google.com" target="_blank" rel="noopener" title="NotebookLM 열기">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H5v12h12v-6h2v8H3V5h2z"/></svg>
    </a>
  </header>

  <section id="page" class="card page-card">
    <div id="page-status" class="muted">
      <span class="spinner small"></span> 페이지를 읽는 중…
    </div>
    <div id="page-info" hidden>
      <div class="page-top">
        <span id="site-badge" class="badge"></span>
        <span id="page-length" class="muted"></span>
      </div>
      <div id="page-title" class="title"></div>
      <div id="page-meta" class="muted"></div>
    </div>
  </section>

  <section class="field">
    <label class="section-label" for="notebook">노트북</label>
    <div class="row">
      <div class="select-wrap">
        <select id="notebook" disabled>
          <option>불러오는 중…</option>
        </select>
      </div>
      <button id="refresh" class="icon-btn" title="목록 새로고침" aria-label="목록 새로고침">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 6V3L8 7l4 4V8a4 4 0 1 1-4 4H6a6 6 0 1 0 6-6z"/></svg>
      </button>
    </div>
    <div id="new-notebook" class="row" hidden>
      <input id="new-name" type="text" placeholder="새 노트북 이름" maxlength="80">
      <button id="create" class="btn-secondary small">만들기</button>
    </div>
  </section>

  <button id="add" class="btn btn-primary" disabled>
    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    <span>소스로 추가</span>
  </button>

  <div id="result" class="status" hidden></div>

  <div id="success-actions" class="success-actions" hidden>
    <a id="open-notebook" class="btn btn-secondary" href="#" target="_blank" rel="noopener">노트북 열기</a>
    <button id="add-more" class="btn btn-secondary">다른 노트북에도 추가</button>
  </div>

  <footer class="footer">
    <span id="stats" class="muted"></span>
    <span class="muted">우클릭 → "이 글을 NotebookLM에 추가"</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
